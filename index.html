<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3d4de0" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>NT CCTV - เข้าสู่ระบบ</title>
<script>
  // render-blocking guard: already logged in -> go straight to dashboard (no flash)
  if (sessionStorage.getItem("ntcctv_auth") === "1" || localStorage.getItem("ntcctv_auth") === "1") {
    location.replace("dashboard.html");
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-wrap">
  <form id="loginForm" class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-video"></i>
      <span>NT <b>CCTV</b></span>
    </div>
    <h1>เข้าสู่ระบบ</h1>
    <p class="login-sub">กรอกข้อมูลเพื่อเข้าใช้งานแผงควบคุม</p>

    <label class="field">
      <span>ชื่อผู้ใช้งาน</span>
      <div class="field-input">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="loginUser" placeholder="admin" autocomplete="username" required />
      </div>
    </label>

    <label class="field">
      <span>รหัสผ่าน</span>
      <div class="field-input">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required />
      </div>
    </label>

    <label class="remember">
      <input type="checkbox" id="loginRemember" />
      <span>จดจำการเข้าสู่ระบบ</span>
    </label>

    <button type="submit" class="btn-primary btn-block">เข้าสู่ระบบ</button>
    <p class="login-error" id="loginError"></p>
    <p class="login-hint">ค่าเริ่มต้น: admin / admin (เพิ่ม/เปลี่ยนผู้ใช้: python manage.py)</p>
  </form>
</div>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
</body>
</html>
